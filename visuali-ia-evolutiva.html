<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>IA que Evoluciona</title>
<style>
  :root{
    --panel: rgba(6,10,16,.50);
    --line: rgba(170,225,255,.16);
    --txt: #e8fbff;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:var(--txt);
    font-family:Arial, Helvetica, sans-serif;
  }
  canvas{
    display:block;
    width:100vw;
    height:100vh;
    background:#000;
    cursor:none;
  }
  #ui{
    position:fixed;
    top:12px;
    left:50%;
    transform:translateX(-50%);
    z-index:20;
    width:min(1280px, calc(100vw - 24px));
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    align-items:center;
    justify-content:center;
    padding:10px 12px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:18px;
    backdrop-filter:blur(10px);
    box-shadow:0 0 24px rgba(0,0,0,.45), inset 0 0 18px rgba(130,220,255,.05);
  }
  #ui button,
  #ui input[type="range"],
  #ui input[type="file"]{
    accent-color:#8cefff;
  }
  #ui button{
    background:rgba(255,255,255,.06);
    border:1px solid rgba(200,240,255,.16);
    color:var(--txt);
    padding:8px 12px;
    border-radius:12px;
    cursor:pointer;
  }
  #ui label{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    white-space:nowrap;
    color:#cdefff;
  }
  #status, #phaseLabel{
    min-width:160px;
    font-size:12px;
    color:#aadff3;
    padding:0 4px;
    text-align:center;
  }
  #hint{
    position:fixed;
    bottom:14px;
    left:50%;
    transform:translateX(-50%);
    z-index:15;
    background:rgba(5,9,14,.26);
    border:1px solid rgba(170,220,255,.10);
    color:#b7dff1;
    padding:8px 14px;
    border-radius:999px;
    font-size:12px;
    letter-spacing:.2px;
    backdrop-filter:blur(6px);
    pointer-events:none;
    text-align:center;
    max-width:calc(100vw - 20px);
  }
</style>
</head>
<body>

<div id="ui">
  <input id="audioFile" type="file" accept="audio/*" />
  <button id="micBtn">Micrófono</button>
  <button id="playBtn">Play / Pausa</button>
  <button id="phaseBtn">Cambiar fase</button>
  <button id="autoBtn">Auto evolución: ON</button>
  <button id="fsBtn">Pantalla completa</button>
  <button id="recBtn">Grabar video</button>

  <label>
    Sensibilidad
    <input id="sens" type="range" min="0.6" max="3.2" step="0.01" value="1.65">
  </label>

  <label>
    Fluidez
    <input id="smooth" type="range" min="0.72" max="0.97" step="0.001" value="0.89">
  </label>

  <label>
    Evolución
    <input id="evolution" type="range" min="0.3" max="2.5" step="0.01" value="1.15">
  </label>

  <div id="status">Sin audio</div>
  <div id="phaseLabel">Fase: Nacimiento</div>
</div>

<div id="hint">IA que evoluciona · Mouse = atrae la inteligencia · Click = impulso evolutivo · Audio = aprendizaje y mutación · F = pantalla completa · R = grabar</div>

<canvas id="c"></canvas>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  const statusEl = document.getElementById('status');
  const phaseLabelEl = document.getElementById('phaseLabel');
  const sensEl = document.getElementById('sens');
  const smoothEl = document.getElementById('smooth');
  const evolutionEl = document.getElementById('evolution');

  let DPR = Math.min(window.devicePixelRatio || 1, 2);
  let W = 0, H = 0;

  function resize(){
    W = innerWidth;
    H = innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  addEventListener('resize', resize);

  const mouse = {
    x: W * 0.5,
    y: H * 0.5,
    tx: W * 0.5,
    ty: H * 0.5,
    down: false,
    pulse: 0
  };

  addEventListener('mousemove', e => {
    mouse.tx = e.clientX;
    mouse.ty = e.clientY;
  });

  addEventListener('mousedown', () => {
    mouse.down = true;
    mouse.pulse = 1;
    boost += 0.8;
    memoryBursts.push({
      x: mouse.x,
      y: mouse.y,
      r: 8,
      a: 1
    });
  });

  addEventListener('mouseup', () => {
    mouse.down = false;
  });

  addEventListener('touchmove', e => {
    const t = e.touches[0];
    if (!t) return;
    mouse.tx = t.clientX;
    mouse.ty = t.clientY;
  }, {passive:true});

  // AUDIO
  let audioCtx = null;
  let analyser = null;
  let freqData = null;
  let timeData = null;
  let currentAudio = null;
  let sourceNode = null;
  let micStream = null;

  let eSmooth = 0;
  let bSmooth = 0;
  let mSmooth = 0;
  let hSmooth = 0;
  let wSmooth = 0;
  let boost = 0;
  let lastBass = 0;

  function ensureAudio(){
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }

  function cleanupSource(){
    if (sourceNode && sourceNode.disconnect) {
      try { sourceNode.disconnect(); } catch(e){}
    }
    sourceNode = null;
  }

  function attachMediaElement(audio){
    const ac = ensureAudio();
    cleanupSource();

    analyser = ac.createAnalyser();
    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0.78;

    const src = ac.createMediaElementSource(audio);
    src.connect(analyser);
    analyser.connect(ac.destination);

    sourceNode = src;
    freqData = new Uint8Array(analyser.frequencyBinCount);
    timeData = new Uint8Array(analyser.fftSize);
  }

  async function useMic(){
    try{
      const ac = ensureAudio();
      await ac.resume();

      if (micStream) micStream.getTracks().forEach(t => t.stop());

      micStream = await navigator.mediaDevices.getUserMedia({ audio:true });

      cleanupSource();
      analyser = ac.createAnalyser();
      analyser.fftSize = 2048;
      analyser.smoothingTimeConstant = 0.82;

      sourceNode = ac.createMediaStreamSource(micStream);
      sourceNode.connect(analyser);

      freqData = new Uint8Array(analyser.frequencyBinCount);
      timeData = new Uint8Array(analyser.fftSize);

      statusEl.textContent = 'Micrófono activo';
    }catch(err){
      statusEl.textContent = 'No se pudo activar el micrófono';
      console.error(err);
    }
  }

  document.getElementById('micBtn').addEventListener('click', useMic);

  document.getElementById('audioFile').addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file) return;

    try{
      const ac = ensureAudio();
      await ac.resume();

      if (currentAudio) {
        currentAudio.pause();
        currentAudio.src = '';
      }

      const audio = new Audio();
      audio.src = URL.createObjectURL(file);
      audio.loop = true;
      audio.crossOrigin = 'anonymous';

      attachMediaElement(audio);
      currentAudio = audio;

      await audio.play();
      statusEl.textContent = 'MP3: ' + file.name;
    }catch(err){
      statusEl.textContent = 'Error al reproducir audio';
      console.error(err);
    }
  });

  document.getElementById('playBtn').addEventListener('click', async () => {
    try{
      const ac = ensureAudio();
      await ac.resume();

      if (currentAudio) {
        if (currentAudio.paused) currentAudio.play();
        else currentAudio.pause();

        statusEl.textContent = currentAudio.paused ? 'Pausado' : 'Reproduciendo';
      } else {
        statusEl.textContent = 'Carga MP3 o usa micrófono';
      }
    }catch(err){
      console.error(err);
    }
  });

  function getAudioFeatures(){
    const sens = parseFloat(sensEl.value);
    const smooth = parseFloat(smoothEl.value);

    if (!analyser || !freqData || !timeData) {
      eSmooth *= 0.965;
      bSmooth *= 0.965;
      mSmooth *= 0.965;
      hSmooth *= 0.965;
      wSmooth *= 0.965;
      boost *= 0.93;
      return { energy:eSmooth, bass:bSmooth, mid:mSmooth, high:hSmooth, wave:wSmooth, boost };
    }

    analyser.getByteFrequencyData(freqData);
    analyser.getByteTimeDomainData(timeData);

    let bass = 0, mid = 0, high = 0;
    let cb = 0, cm = 0, ch = 0;

    for (let i = 0; i < freqData.length; i++) {
      const v = freqData[i] / 255;
      const hz = i * audioCtx.sampleRate / analyser.fftSize;

      if (hz < 180) { bass += v; cb++; }
      else if (hz < 1800) { mid += v; cm++; }
      else { high += v; ch++; }
    }

    bass = cb ? bass / cb : 0;
    mid = cm ? mid / cm : 0;
    high = ch ? high / ch : 0;

    let wave = 0;
    for (let i = 0; i < timeData.length; i++) {
      wave += Math.abs((timeData[i] - 128) / 128);
    }
    wave /= timeData.length;

    let energy = bass * 0.56 + mid * 0.31 + high * 0.13;
    energy *= sens;
    bass *= sens;
    mid *= sens;
    high *= sens;
    wave *= sens * 1.12;

    eSmooth = eSmooth * smooth + energy * (1 - smooth);
    bSmooth = bSmooth * smooth + bass * (1 - smooth);
    mSmooth = mSmooth * smooth + mid * (1 - smooth);
    hSmooth = hSmooth * smooth + high * (1 - smooth);
    wSmooth = wSmooth * smooth + wave * (1 - smooth);

    const db = Math.max(0, bSmooth - lastBass);
    if (db > 0.03) boost += db * 6.8;
    boost *= 0.90;
    lastBass = bSmooth;

    return {
      energy: eSmooth,
      bass: bSmooth,
      mid: mSmooth,
      high: hSmooth,
      wave: wSmooth,
      boost: Math.min(2.8, boost)
    };
  }

  // RECORD
  let recorder = null;
  let recording = false;
  let recordedChunks = [];

  function startRecording(){
    try{
      recordedChunks = [];
      const stream = canvas.captureStream(60);

      recorder = new MediaRecorder(stream, { mimeType:'video/webm;codecs=vp9' });

      recorder.ondataavailable = e => {
        if (e.data && e.data.size > 0) recordedChunks.push(e.data);
      };

      recorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type:'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'ia-que-evoluciona.webm';
        a.click();
        URL.revokeObjectURL(url);
      };

      recorder.start();
      recording = true;
      document.getElementById('recBtn').textContent = 'Detener grabación';
      statusEl.textContent = 'Grabando video...';
    }catch(err){
      statusEl.textContent = 'Tu navegador no permitió grabación';
      console.error(err);
    }
  }

  function stopRecording(){
    if (recorder && recording) {
      recorder.stop();
      recording = false;
      document.getElementById('recBtn').textContent = 'Grabar video';
      statusEl.textContent = 'Grabación finalizada';
    }
  }

  document.getElementById('recBtn').addEventListener('click', () => {
    if (!recording) startRecording();
    else stopRecording();
  });

  document.getElementById('fsBtn').addEventListener('click', async () => {
    try{
      if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
      else await document.exitFullscreen();
    }catch(err){
      console.error(err);
    }
  });

  // VISUAL SYSTEM
  const PHASES = [
    'Nacimiento',
    'Red neuronal',
    'Mente viva',
    'Entidad ascendente'
  ];

  let phase = 0;
  let autoEvolution = true;
  let evolutionClock = 0;
  let phaseBlend = 1;

  document.getElementById('phaseBtn').addEventListener('click', () => {
    phase = (phase + 1) % PHASES.length;
    phaseBlend = 0;
    phaseLabelEl.textContent = 'Fase: ' + PHASES[phase];
  });

  document.getElementById('autoBtn').addEventListener('click', e => {
    autoEvolution = !autoEvolution;
    e.target.textContent = 'Auto evolución: ' + (autoEvolution ? 'ON' : 'OFF');
  });

  const particles = [];
  const COUNT = 1000;

  function randRange(a,b){ return a + Math.random() * (b-a); }

  for (let i = 0; i < COUNT; i++) {
    const ang = Math.random() * Math.PI * 2;
    const r = Math.random() * Math.min(innerWidth, innerHeight) * 0.35;
    particles.push({
      x: Math.cos(ang) * r,
      y: Math.sin(ang) * r,
      vx: 0,
      vy: 0,
      size: 0.8 + Math.random() * 2.4,
      seed: Math.random() * 1000,
      life: Math.random() * 100,
      mem: Math.random(),
      hue: Math.random(),
      targetX: randRange(-200,200),
      targetY: randRange(-120,120)
    });
  }

  const memoryBursts = [];

  function drawGlow(x, y, r, color, alpha){
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(${color[0]},${color[1]},${color[2]},${alpha})`);
    g.addColorStop(0.35, `rgba(${color[0]},${color[1]},${color[2]},${alpha*0.35})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  function lerpColor(a, b, t){
    return [
      a[0] + (b[0] - a[0]) * t,
      a[1] + (b[1] - a[1]) * t,
      a[2] + (b[2] - a[2]) * t
    ];
  }

  function brainColor(t){
    const c1 = [40, 240, 255];
    const c2 = [100, 100, 255];
    const c3 = [255, 60, 220];
    const c4 = [255, 180, 70];

    if (t < 0.33) return lerpColor(c1, c2, t / 0.33);
    if (t < 0.66) return lerpColor(c2, c3, (t - 0.33) / 0.33);
    return lerpColor(c3, c4, (t - 0.66) / 0.34);
  }

  function drawCursor(a){
    const r = 8 + a.high * 8 + mouse.pulse * 10;
    ctx.save();
    ctx.strokeStyle = `rgba(190,245,255,${0.18 + a.high * 0.25})`;
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.arc(mouse.x, mouse.y, r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(mouse.x - 14, mouse.y);
    ctx.lineTo(mouse.x + 14, mouse.y);
    ctx.moveTo(mouse.x, mouse.y - 14);
    ctx.lineTo(mouse.x, mouse.y + 14);
    ctx.stroke();
    ctx.restore();
  }

  function drawMemoryBursts(a, cx, cy){
    for (let i = memoryBursts.length - 1; i >= 0; i--) {
      const b = memoryBursts[i];
      b.r += 5 + a.boost * 1.5;
      b.a *= 0.95;

      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(150,220,255,${b.a * 0.30})`;
      ctx.lineWidth = 1.4 + a.high * 1.2;
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(b.x, b.y);
      ctx.strokeStyle = `rgba(255,90,220,${b.a * 0.10})`;
      ctx.lineWidth = 1;
      ctx.stroke();

      if (b.a < 0.03) memoryBursts.splice(i, 1);
    }
  }

  function phaseTargets(p, phase, time, a, evoPower){
    if (phase === 0) {
      // NACIMIENTO
      const tx = Math.sin(p.seed * 0.01 + time * 0.0008) * (160 + p.mem * 120);
      const ty = Math.cos(p.seed * 0.02 + time * 0.0006) * (90 + p.mem * 100);
      return { tx, ty };
    }

    if (phase === 1) {
      // RED NEURONAL
      const gx = Math.sin(p.seed * 0.013) * 220;
      const gy = Math.cos(p.seed * 0.017) * 140;
      return { tx: gx, ty: gy };
    }

    if (phase === 2) {
      // MENTE VIVA
      const r = 60 + p.mem * 180 + Math.sin(time * 0.001 + p.seed) * 25;
      const ang = p.seed * 0.025 + time * (0.0005 + p.mem * 0.0007) * (1 + a.mid * 1.8);
      return {
        tx: Math.cos(ang) * r,
        ty: Math.sin(ang) * r * 0.65
      };
    }

    // ENTIDAD ASCENDENTE
    const col = (p.seed % 9) - 4;
    const row = ((Math.floor(p.seed) % 14) - 7);
    const tx = col * (28 + evoPower * 5) + Math.sin(time * 0.0012 + p.seed) * 12;
    const ty = row * (18 + evoPower * 4) + Math.cos(time * 0.0011 + p.seed) * 10;
    return { tx, ty };
  }

  function drawConnections(cPositions, a, cx, cy){
    const maxDist = phase === 0 ? 55 : phase === 1 ? 90 : phase === 2 ? 100 : 85;
    const skip = phase === 0 ? 10 : 8;

    for (let i = 0; i < cPositions.length; i += skip) {
      const A = cPositions[i];
      for (let j = i + skip; j < cPositions.length; j += skip) {
        const B = cPositions[j];
        const dx = A.x - B.x;
        const dy = A.y - B.y;
        const d = Math.hypot(dx, dy);
        if (d < maxDist) {
          const alpha = (1 - d / maxDist) * (phase === 0 ? 0.03 : phase === 1 ? 0.10 : phase === 2 ? 0.08 : 0.07);
          ctx.beginPath();
          ctx.moveTo(A.x, A.y);
          ctx.lineTo(B.x, B.y);
          ctx.strokeStyle = `rgba(${120 + a.high*80},${180 + a.mid*50},255,${alpha + a.wave * 0.05})`;
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }
    }

    if (phase >= 2) {
      ctx.beginPath();
      ctx.arc(cx, cy, 26 + a.bass * 14, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(220,245,255,${0.18 + a.high * 0.18})`;
      ctx.lineWidth = 1.5 + a.high;
      ctx.stroke();
    }
  }

  let lastTime = performance.now();

  function animate(now){
    requestAnimationFrame(animate);

    const dt = Math.min(33, now - lastTime);
    lastTime = now;

    const a = getAudioFeatures();
    const evoPower = parseFloat(evolutionEl.value);

    mouse.x += (mouse.tx - mouse.x) * 0.08;
    mouse.y += (mouse.ty - mouse.y) * 0.08;
    mouse.pulse *= 0.92;

    phaseBlend += 0.02;
    if (phaseBlend > 1) phaseBlend = 1;

    if (autoEvolution) {
      evolutionClock += dt * (0.0018 + a.energy * 0.0015) * evoPower;
      if (evolutionClock > 18) {
        evolutionClock = 0;
        phase = (phase + 1) % PHASES.length;
        phaseBlend = 0;
        phaseLabelEl.textContent = 'Fase: ' + PHASES[phase];
      }
    }

    const cx = W * 0.5 + (mouse.x - W * 0.5) * 0.10;
    const cy = H * 0.5 + (mouse.y - H * 0.5) * 0.08;

    ctx.fillStyle = 'rgba(0,0,0,0.16)';
    ctx.fillRect(0, 0, W, H);

    drawGlow(cx, cy, 280 + a.energy * 110, [0, 70, 150], 0.04 + a.energy * 0.05);
    drawGlow(cx, cy, 160 + a.mid * 90, [110, 0, 180], 0.03 + a.high * 0.05);

    drawMemoryBursts(a, cx, cy);

    const cPositions = [];

    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      const target = phaseTargets(p, phase, now, a, evoPower);

      // aprendizaje progresivo
      p.targetX += (target.tx - p.targetX) * (0.020 + a.mid * 0.010 + evoPower * 0.006);
      p.targetY += (target.ty - p.targetY) * (0.020 + a.mid * 0.010 + evoPower * 0.006);

      // fuerza hacia objetivo
      p.vx += (p.targetX - p.x) * (0.0018 + evoPower * 0.0007);
      p.vy += (p.targetY - p.y) * (0.0018 + evoPower * 0.0007);

      // mouse attractor
      const wx = cx + p.x;
      const wy = cy + p.y;
      const mdx = mouse.x - wx;
      const mdy = mouse.y - wy;
      const md = Math.hypot(mdx, mdy) || 0.0001;
      const mousePull = Math.max(0, 1 - md / 220) * (0.05 + a.energy * 0.04);
      p.vx += (mdx / md) * mousePull;
      p.vy += (mdy / md) * mousePull;

      // comportamiento según fase
      if (phase === 0) {
        p.vx += (Math.random() - 0.5) * (0.18 + a.high * 0.5);
        p.vy += (Math.random() - 0.5) * (0.18 + a.high * 0.5);
      } else if (phase === 1) {
        p.vx += Math.sin(now * 0.001 + p.seed) * 0.015 * (1 + a.wave * 2);
        p.vy += Math.cos(now * 0.0012 + p.seed) * 0.015 * (1 + a.wave * 2);
      } else if (phase === 2) {
        const dx = -p.x;
        const dy = -p.y;
        const d = Math.hypot(dx, dy) || 0.0001;
        const tx = -dy / d;
        const ty = dx / d;
        p.vx += tx * (0.010 + a.mid * 0.020);
        p.vy += ty * (0.010 + a.mid * 0.020);
      } else if (phase === 3) {
        p.vx += Math.sin(now * 0.0009 + p.seed * 0.4) * 0.008 * (1 + a.high);
        p.vy += Math.cos(now * 0.0008 + p.seed * 0.4) * 0.008 * (1 + a.high);
      }

      // audio mutation
      p.vx += (Math.random() - 0.5) * a.boost * 0.12;
      p.vy += (Math.random() - 0.5) * a.boost * 0.12;

      p.x += p.vx;
      p.y += p.vy;

      const friction = phase === 0 ? 0.93 : phase === 1 ? 0.94 : phase === 2 ? 0.95 : 0.96;
      p.vx *= friction;
      p.vy *= friction;

      p.life += 0.02 + a.energy * 0.08;

      const px = cx + p.x;
      const py = cy + p.y;

      cPositions.push({ x:px, y:py });

      const col = brainColor((Math.sin(p.life + p.hue * 6) * 0.5 + 0.5));
      const s = p.size * (1 + a.high * 0.35 + (phase === 2 ? 0.4 : 0));

      drawGlow(px, py, s * 5, col, 0.08 + a.energy * 0.16);

      ctx.beginPath();
      ctx.arc(px, py, s, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${col[0]},${col[1]},${col[2]},${0.30 + a.energy * 0.30})`;
      ctx.fill();

      if (phase === 2 || phase === 3) {
        if (i % 14 === 0) {
          ctx.beginPath();
          ctx.moveTo(px, py);
          ctx.lineTo(cx, cy);
          ctx.strokeStyle = `rgba(${col[0]},${col[1]},${col[2]},${0.03 + a.high * 0.08})`;
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }
    }

    drawConnections(cPositions, a, cx, cy);

    // núcleo vivo
    if (phase >= 2) {
      drawGlow(cx, cy, 90 + a.bass * 45 + a.boost * 12, [40, 220, 255], 0.10 + a.energy * 0.08);
      drawGlow(cx, cy, 55 + a.mid * 28, [255, 60, 220], 0.08 + a.high * 0.06);
      drawGlow(cx, cy, 24 + a.bass * 12, [255, 255, 255], 0.18 + a.boost * 0.08);
    }

    // halo exterior
    if (phase === 3) {
      for (let k = 0; k < 3; k++) {
        const rr = 90 + k * 26 + Math.sin(now * 0.0014 + k) * (4 + a.wave * 8);
        ctx.beginPath();
        ctx.ellipse(cx, cy, rr * 1.15, rr * 0.72, 0, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(${120 + k*40},${180 - k*20},255,${0.04 + a.high * 0.08})`;
        ctx.lineWidth = 1.2 + a.high * 1.0;
        ctx.stroke();
      }
    }

    drawCursor(a);
  }

  requestAnimationFrame(animate);

  addEventListener('keydown', async e => {
    if (e.key.toLowerCase() === 'f') {
      try{
        if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
        else await document.exitFullscreen();
      }catch(err){}
    }

    if (e.key.toLowerCase() === 'r') {
      if (!recording) startRecording();
      else stopRecording();
    }

    if (e.key.toLowerCase() === 'm') {
      useMic();
    }

    if (e.key.toLowerCase() === 'n') {
      phase = (phase + 1) % PHASES.length;
      phaseBlend = 0;
      phaseLabelEl.textContent = 'Fase: ' + PHASES[phase];
    }

    if (e.key === ' ') {
      e.preventDefault();
      try{
        const ac = ensureAudio();
        await ac.resume();
        if (currentAudio) {
          if (currentAudio.paused) currentAudio.play();
          else currentAudio.pause();
        }
      }catch(err){}
    }
  });
})();
</script>
